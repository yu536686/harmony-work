name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm ci
      - name: Test application and installer lock
        run: npm test
      - name: Build standard Windows installers
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis,msi
      - name: Build full offline bootstrapper installer
        shell: pwsh
        run: ./scripts/build-full-installer.ps1 -SkipTauriBuild
      - uses: actions/upload-artifact@v4
        with:
          name: Xiaoheng-WorkBuddy-Windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            release/full/Xiaoheng-WorkBuddy-Setup.exe
          if-no-files-found: error
      - name: Attach installers to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            release/full/Xiaoheng-WorkBuddy-Setup.exe
