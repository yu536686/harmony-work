[package]
name = "xiaoheng-workbuddy"
version = "0.6.36-alpha.0"
description = "Harmony Xiaoheng AI desktop workbench"
authors = ["Harmony"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "xiaoheng_workbuddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
futures-util = "0.3"
keyring = "3"
directories = "6"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "native-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
