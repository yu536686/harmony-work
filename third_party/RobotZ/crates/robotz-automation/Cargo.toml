[package]
name = "robotz-automation"
description = "Cross-platform desktop control tools (screen capture, mouse/keyboard, windows) for RobotZ"
version = "0.1.6"
edition = "2021"
license = "Apache-2.0"
authors = ["Piscis Team"]
rust-version = "1.77.2"

[dependencies]
robotz-core = { path = "../robotz-core" }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
once_cell = "1"
# Cross-platform screenshot library (Linux X11/Wayland, macOS). Windows uses
# the Win32 GDI path in src/screen/windows.rs instead.
xcap = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows UI Automation tree (uia tool).
uiautomation = { version = "0.24", features = ["all"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []

[lints.rust]
warnings = "warn"
