[package]
name = "robotz-core"
description = "Zero-dependency tool abstraction and process-spawn helpers for RobotZ"
version = "0.1.6"
edition = "2021"
license = "Apache-2.0"
authors = ["Piscis Team"]
rust-version = "1.77.2"

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[lints.rust]
warnings = "warn"
